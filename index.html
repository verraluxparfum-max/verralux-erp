<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Verralux Parfum — ERP</title>
<meta name="theme-color" content="#211A12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="mobile-nav-drawer">
    <div class="brand">
      <div class="brand-mark">Verralux</div>
      <div class="brand-sub">Parfum · ERP</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn-secondary" id="btn-export">⬇ Backup Data</button>
      <label class="btn-secondary" style="text-align:center; cursor:pointer;">
        ⬆ Restore Backup
        <input type="file" id="file-import" accept="application/json" style="display:none;">
      </label>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="btn-menu-toggle">☰</button>
        <h1 id="view-title">Dashboard</h1>
      </div>
    </div>
    <div class="view-container">
      <div id="view"></div>
    </div>
  </main>
</div>

<div id="toast-host"></div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/inventory.js"></script>
<script src="js/purchases.js"></script>
<script src="js/sales.js"></script>
<script src="js/expenses.js"></script>
<script src="js/payments.js"></script>
<script src="js/assets.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
